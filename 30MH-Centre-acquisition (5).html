<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centre d'acquisition 30MH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800;1,900&display=swap">
<style>
/* Identité 30 Minute HIT : bandeau noir + logo, bleu ciel de marque en aplat, bleu foncé pour les traits et le texte, Poppins italique lourd en titres */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --surface-2:#eef4f8; --ink:#141414; --muted:#56616b; --line:#dbe3e9;
  --sky:#8dcdf3; --sky-soft:#e3f2fc; --on-sky:#141414;
  --accent:#16679a; --heat-ink:#ffffff;
  --steel:#7f7f7f; --bench:#8e979f; --s2:#141414;
  --ok:#1d7a52; --ok-soft:#e1f2e9; --warn:#8a5a0e; --warn-soft:#fbf0dc; --bad:#b4232c; --bad-soft:#fbe4e5;
  --band:#141414; --band-ink:#ffffff; --band-muted:#b8c2ca;
  --display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1013; --surface:#161a1e; --surface-2:#1c2227; --ink:#f1f4f6; --muted:#9ca7b0; --line:#2a3239;
  --sky:#8dcdf3; --sky-soft:#13303f; --on-sky:#141414;
  --accent:#8dcdf3; --heat-ink:#0d1013;
  --steel:#9a9a9a; --bench:#7f8a93; --s2:#e9eef2;
  --ok:#5cc58f; --ok-soft:#12301f; --warn:#e8b54e; --warn-soft:#33270f; --bad:#ff7b80; --bad-soft:#3a1517;
  --band:#000000; --band-ink:#ffffff; --band-muted:#a9b4bc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1013; --surface:#161a1e; --surface-2:#1c2227; --ink:#f1f4f6; --muted:#9ca7b0; --line:#2a3239;
  --sky:#8dcdf3; --sky-soft:#13303f; --on-sky:#141414;
  --accent:#8dcdf3; --heat-ink:#0d1013;
  --steel:#9a9a9a; --bench:#7f8a93; --s2:#e9eef2;
  --ok:#5cc58f; --ok-soft:#12301f; --warn:#e8b54e; --warn-soft:#33270f; --bad:#ff7b80; --bad-soft:#3a1517;
  --band:#000000; --band-ink:#ffffff; --band-muted:#a9b4bc; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--band);color:var(--band-ink);border-bottom:6px solid var(--sky)}
header.band .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 18px}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
.brand img{height:52px;width:auto;display:block;max-width:100%}
.brand .ttl{display:flex;flex-direction:column;gap:2px;padding-left:16px;border-left:2px solid #ffffff2e}
.eyebrow{font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:11.5px;color:var(--sky)}
h1{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(22px,3.2vw,32px);line-height:1;margin:0;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.controls label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--band-muted);display:flex;flex-direction:column;gap:4px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
header.band select{background:#ffffff12;color:var(--band-ink);border-color:#ffffff3a;font-size:13.5px}
header.band select option{color:#141414;background:#fff}
.seg{display:inline-flex;border:1px solid #ffffff3a;border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;background:transparent;color:var(--band-ink);border:0;padding:7px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sky);color:var(--on-sky)}
.custom{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font-family:var(--display);font-weight:700;font-style:italic;font-size:14px;letter-spacing:.04em;text-transform:uppercase;background:transparent;color:var(--band-ink);opacity:.6;border:0;border-bottom:4px solid transparent;padding:10px 14px 8px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
nav.tabs button:hover{opacity:.9}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--sky);color:var(--sky)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
main .wrap{padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.panel h2{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:-.005em;font-size:19px;margin:0 0 4px;line-height:1.2}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:72ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.02em}
.kpi .cmp{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.panel.hero{background:var(--band);color:#fff;border-color:var(--band)}
.panel.hero .tag{color:var(--sky)}
.panel.hero .reasons li{color:#e4eaee}
.decision{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px}
@media (max-width:820px){.decision{grid-template-columns:1fr}}
.verdict{font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(28px,4vw,44px);text-transform:uppercase;line-height:1;margin:10px 0 12px;letter-spacing:-.02em;text-wrap:balance}
.verdict span{background:var(--sky);color:var(--on-sky);padding:0 .18em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.reasons{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.reasons li{max-width:70ch}
.reasons li::marker{color:var(--sky)}
.funnel{display:flex;flex-direction:column;gap:14px}
.fstage{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:10px;align-items:center}
@media (max-width:520px){.fstage{grid-template-columns:1fr}}
.fstage .nm{font-weight:600;font-size:13.5px}
.fstage .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{position:relative;height:16px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:999px}
.bar.st>i{background:var(--accent)} .bar.fr>i{background:var(--bench);opacity:.5}
.fstage .nums{font-size:13px;text-align:right;line-height:1.3}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.chart svg{width:100%;height:auto;display:block}
.btn{font:inherit;font-size:13.5px;font-weight:600;border-radius:999px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--sky);border-color:var(--sky);color:var(--on-sky);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form input{width:100%}
textarea{width:100%;min-height:170px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.note{font-size:12.5px;color:var(--muted)}
.msg{font-size:13px;padding:9px 12px;border-radius:10px}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.warn{background:var(--warn-soft);color:var(--warn)}
.heat{display:grid;gap:4px;min-width:640px}
.heat .c{padding:9px 4px;text-align:center;font-size:12px;border-radius:6px;font-weight:600}
.heat .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.heat .y{font-weight:800;font-style:italic;font-size:15px;display:flex;align-items:center}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:22px}
@media (max-width:820px){.sim{grid-template-columns:1fr}}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.out div{background:var(--sky-soft);border-radius:12px;padding:10px 12px}
.out b{display:block;font-size:24px;font-weight:800;line-height:1.15}
.out span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.method dl{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:8px 18px;margin:0}
@media (max-width:620px){.method dl{grid-template-columns:1fr}}
.method dt{font-weight:700}
.method dd{margin:0;color:var(--muted)}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.selrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 18px;align-self:flex-start}
.selrow label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger[data-confirm="1"]{background:var(--bad);color:#fff}
.chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
td.ck,th.ck{text-align:center;width:36px;padding-left:6px;padding-right:6px}
header.band .btn.print{background:transparent;color:var(--band-ink);border-color:#ffffff4d}
header.band .btn.print:hover{border-color:var(--sky);color:var(--sky)}
.printhead{display:none}
@media print{
  :root,:root[data-theme]{--bg:#ffffff;--surface:#ffffff;--surface-2:#eef4f8;--ink:#141414;--muted:#4f5a63;--line:#d6dee4;--sky:#8dcdf3;--sky-soft:#e3f2fc;--accent:#16679a;--heat-ink:#ffffff;--bench:#8e979f;--s2:#141414;--ok:#1d7a52;--ok-soft:#e1f2e9;--warn:#8a5a0e;--warn-soft:#fbf0dc;--bad:#b4232c;--bad-soft:#fbe4e5;--band:#141414;color-scheme:light}
  @page{size:letter;margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:11px;background:#fff}
  header.band,body::before,.noprint{display:none!important}
  .printhead{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#141414;color:#fff;border-bottom:5px solid var(--sky);border-radius:12px;padding:12px 16px;margin-bottom:6px}
  .printhead img{height:38px;width:auto}
  .printhead h1{font-size:20px;color:#fff}
  main .wrap{padding:0!important;max-width:none;gap:12px}
  .panel,.kpi{break-inside:avoid;page-break-inside:avoid;box-shadow:none}
  .pblock{break-before:page;page-break-before:always;display:flex;flex-direction:column;gap:12px}
  .pblock.first{break-before:auto;page-break-before:auto}
  .pblock>.ptitle{font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:18px;color:var(--ink);margin:0;display:flex;align-items:center;gap:8px}
  .pblock>.ptitle::before{content:"";width:22px;height:8px;background:var(--sky);border-radius:2px}
  .grid2{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .sim{grid-template-columns:1fr 1.3fr}
  input,select{border:1px solid var(--line)}
  .tablewrap{overflow:visible}
  th{position:static}
  .heat{min-width:0}
  .selrow{border:0;padding:0}
}
</style>
</head>

<script>
(function(){
"use strict";
/* ---------- état ---------- */
const S = {
  months:{}, params:{cible:200, cibleLT:260, echeance:6, budgetMin:1500, budgetMax:2000, prixMensuel:75},
  sel:null, win:3, custom:false, from:null, to:null, tab:"bord", selDel:new Set(), canEdit:true, loaded:false, parsed:null, editing:null, lang:"fr"
};
const T=(fr,en)=>S.lang==="en"?en:fr;
const LOC=()=>S.lang==="en"?"en-CA":"fr-CA";

/* ---------- formats ---------- */
const MOIS_FR=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const MOIS_EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MOIS=()=>S.lang==="en"?MOIS_EN:MOIS_FR;
const fmtM=k=>{const [y,m]=k.split("-");return MOIS()[+m-1]+" "+y};
const keyAdd=(k,n)=>{let [y,m]=k.split("-").map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+String(m).padStart(2,"0")};
const NF=(d0,d1)=>new Intl.NumberFormat(LOC(),{minimumFractionDigits:d0,maximumFractionDigits:d1});
const fmt0=v=>NF(0,0).format(v), fmt1=v=>NF(1,1).format(v);
const ok=v=>v!=null&&isFinite(v);
const cur=(v,d)=>{const s=NF(d,d).format(Math.abs(v));const neg=v<0?"-":"";return S.lang==="en"?neg+"$"+s:neg+s+" $"};
const money=v=>ok(v)?cur(Math.round(v),0):"—";
const money2=v=>ok(v)?cur(v,2):"—";
const pct=v=>ok(v)?fmt1(v*100)+(S.lang==="en"?"%":" %"):"—";
const pctAxis=v=>fmt0(v*100)+(S.lang==="en"?"%":" %");
const num=v=>ok(v)?fmt0(v):"—";
const ratio=v=>ok(v)?fmt1(v)+(S.lang==="en"?":1":" : 1"):"—";
const pts=v=>fmt1(Math.abs(v))+" pt";
const dv=(a,b)=>(a==null||b==null||!b)?null:a/b;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const keys=()=>Object.keys(S.months).sort();
const Q=s=>T("« "+s+" »","“"+s+"”");

/* ---------- calculs ---------- */
const COUNT=["leads","booked","schedBook","schedCame","came","newActive","expiredPrev","activePrev","ltv","impressions","initRev","spend","autres"];
function aggregate(endKey,w){
  const ks=[];for(let i=w-1;i>=0;i--){const k=keyAdd(endKey,-i);if(S.months[k])ks.push(k)}
  if(!ks.length)return null;
  const a={n:ks.length,keys:ks};COUNT.forEach(f=>a[f]=0);
  const fr={booked:[],completed:[],sales:[],overall:[],churn:[]};
  ks.forEach(k=>{const d=S.months[k];COUNT.forEach(f=>a[f]+=+(d[f]||0));
    if(d.fr)Object.keys(fr).forEach(f=>{if(d.fr[f]!=null)fr[f].push(d.fr[f])})});
  const mean=v=>v.length?v.reduce((x,y)=>x+y,0)/v.length:null;
  a.fr={};Object.keys(fr).forEach(f=>a.fr[f]=mean(fr[f]));
  const dep=a.spend+a.autres,cac=dv(dep,a.newActive),ltvM=dv(a.ltv,a.newActive);
  return Object.assign(a,{dep,
    rBook:dv(a.booked,a.leads), rShow:dv(a.schedCame,a.schedBook), rClose:dv(a.newActive,a.came),
    rGlobal:dv(a.newActive,a.leads), churn:dv(a.expiredPrev,a.activePrev), net:a.newActive-a.expiredPrev,
    cpl:dv(dep,a.leads), cpm:a.impressions?a.spend/a.impressions*1000:null, lp1k:a.impressions?a.leads/a.impressions*1000:null,
    cpEssai:dv(dep,a.came), cac, ltvM, initM:dv(a.initRev,a.newActive), roiInit:dv(a.initRev,dep),
    ltvcac:(cac&&ltvM)?ltvM/cac:null});
}
const STAGES=[
  {k:"rBook",f:"booked",nm:["Réservation d'essai","Trial booking"],d:["Essais réservés ÷ leads","Booked trials ÷ leads"],num:"booked",den:"leads"},
  {k:"rShow",f:"completed",nm:["Présence à l'essai","Trial show-up"],d:["Venues ÷ essais planifiés","Show-ups ÷ scheduled trials"],num:"schedCame",den:"schedBook"},
  {k:"rClose",f:"sales",nm:["Closing en vente","Sales close"],d:["Nouveaux membres ÷ venues","New members ÷ show-ups"],num:"newActive",den:"came"},
  {k:"rGlobal",f:"overall",nm:["Conversion globale","Overall conversion"],d:["Nouveaux membres ÷ leads","New members ÷ leads"],num:"newActive",den:"leads"}
];
const SN=s=>T(s.nm[0],s.nm[1]), SD=s=>T(s.d[0],s.d[1]);
function losses(a){
  return STAGES.slice(0,3).map(s=>{const r=a[s.k],f=a.fr[s.f];
    if(r==null||f==null||r>=f)return {s,lost:0,r,f};
    return {s,lost:a.newActive*(Math.min(f/r,4)-1),r,f}});
}
function diagnose(a,prev){
  const out={reasons:[],level:"neutral",verdict:T("Données insuffisantes","Not enough data"),action:""};
  if(!a||!a.leads)return out;
  const L=losses(a).filter(x=>x.lost>0.25).sort((x,y)=>y.lost-x.lost);
  const gap=s=>(a[s.k]!=null&&a.fr[s.f]!=null)?(a[s.k]-a.fr[s.f]):null;
  const weak=STAGES.slice(0,3).filter(s=>gap(s)!=null&&gap(s)<-0.05);
  const r=a.ltvcac;
  if(r==null){out.verdict=T("Aucun nouveau membre sur la période","No new members in this period");out.level="bad";
    out.reasons.push(T("Aucune vente enregistrée : le coût d'acquisition est incalculable. Vérifier d'abord le suivi des essais avant toute dépense additionnelle.","No sales recorded, so acquisition cost cannot be calculated. Check trial follow-up before spending more."));return out}
  if(r>=5&&!weak.length){out.verdict=T("Accélérer","Accelerate");out.level="ok";out.action=T("Hausse de budget de 20 à 30 % recommandée, par paliers mensuels.","Raise the budget by 20 to 30%, in monthly steps.")}
  else if(r>=3){out.verdict=T("Maintenir et corriger","Hold and fix");out.level="warn";
    out.action=weak.length?T("Garder le budget actuel et corriger l'étape "+Q(SN(weak[0]).toLowerCase())+" avant d'investir davantage.","Keep the current budget and fix the "+Q(SN(weak[0]).toLowerCase())+" stage before investing more."):T("Garder le budget et tester un nouveau message ou ciblage avant de hausser.","Keep the budget and test a new message or targeting before raising it.")}
  else {out.verdict=T("Réduire et réallouer","Cut and reallocate");out.level="bad";out.action=T("Réduire la dépense publicitaire et réaffecter une partie du budget au suivi des leads (appels, textos, relances) et à la présence aux essais.","Cut ad spend and move part of the budget to lead follow-up (calls, texts, reminders) and trial show-up.")}
  out.reasons.push(T("Chaque nouveau membre coûte "+money(a.cac)+" en marketing et rapporte une valeur à vie projetée de "+money(a.ltvM)+" (ratio "+ratio(r)+"). Seuil sain : 3 : 1 ; zone d'accélération : 5 : 1 et plus.",
    "Each new member costs "+money(a.cac)+" in marketing and brings a projected lifetime value of "+money(a.ltvM)+" (ratio "+ratio(r)+"). Healthy threshold: 3:1; acceleration zone: 5:1 and above."));
  if(L.length){const t=L[0];out.reasons.push(T("Le plus gros goulot est "+Q(SN(t.s).toLowerCase())+" : "+pct(t.r)+" contre "+pct(t.f)+" pour la franchise. Au niveau franchise, cette étape aurait produit environ "+fmt1(t.lost)+" membre(s) de plus sur la période, sans dollar publicitaire additionnel.",
    "The biggest bottleneck is "+Q(SN(t.s).toLowerCase())+": "+pct(t.r)+" versus "+pct(t.f)+" for the franchise. At franchise level, this stage would have produced about "+fmt1(t.lost)+" more member(s) in the period, with no extra ad dollars."))}
  if(prev&&prev.lp1k&&a.lp1k){const ch=a.lp1k/prev.lp1k-1;
    if(ch<-0.3&&a.impressions>prev.impressions)out.reasons.push(T("La portée a augmenté ("+num(a.impressions)+" impressions contre "+num(prev.impressions)+" un an plus tôt) mais le rendement en leads a chuté de "+fmt0(Math.abs(ch*100))+" % ("+fmt1(a.lp1k)+" lead par 1 000 impressions). Le ciblage achète de l'audience moins qualifiée : revoir audiences et créatifs avant d'augmenter la mise.",
      "Reach went up ("+num(a.impressions)+" impressions versus "+num(prev.impressions)+" a year earlier) but lead yield fell "+fmt0(Math.abs(ch*100))+"% ("+fmt1(a.lp1k)+" leads per 1,000 impressions). Targeting is buying a less qualified audience: review audiences and creative before raising spend."))}
  if(prev&&prev.cac&&a.cac){const ch=a.cac/prev.cac-1;if(Math.abs(ch)>0.25)out.reasons.push(T("Le coût par nouveau membre est passé de "+money(prev.cac)+" à "+money(a.cac)+" sur un an ("+(ch>0?"+":"−")+fmt0(Math.abs(ch*100))+" %).",
    "Cost per new member went from "+money(prev.cac)+" to "+money(a.cac)+" over one year ("+(ch>0?"+":"−")+fmt0(Math.abs(ch*100))+"%)."))}
  if(a.churn!=null&&a.fr.churn!=null&&a.churn>a.fr.churn+0.02)out.reasons.push(T("Le taux d'annulation ("+pct(a.churn)+") dépasse la franchise ("+pct(a.fr.churn)+"). Chaque point de rétention gagné vaut un point d'acquisition, à coût presque nul.",
    "The cancellation rate ("+pct(a.churn)+") is above the franchise ("+pct(a.fr.churn)+"). Each point of retention gained is worth a point of acquisition, at almost no cost."));
  if(a.net<0)out.reasons.push(T("Bilan net estimé de la période : "+a.net+" membres (ventes moins expirations). L'acquisition ne compense pas encore les départs.",
    "Estimated net change for the period: "+a.net+" members (sales minus expirations). Acquisition is not yet replacing departures."));
  if(a.newActive<8)out.reasons.push(T("Petit échantillon ("+a.newActive+" ventes) : confirmer la tendance sur la fenêtre de 3 ou 12 mois avant une décision budgétaire importante.",
    "Small sample ("+a.newActive+" sales): confirm the trend on the 3- or 12-month window before a major budget decision."));
  return out;
}

/* ---------- graphiques SVG ---------- */
function lineChart(series,ks,o={}){
  const W=640,H=o.h||220,P={l:52,r:30,t:14,b:30};
  const xs=i=>P.l+(ks.length<2?0.5:i/(ks.length-1))*(W-P.l-P.r);
  let all=[];series.forEach(s=>s.values.forEach(v=>{if(ok(v))all.push(v)}));
  if(!all.length)return '<div class="empty">'+T("Pas encore de données pour ce graphique.","No data for this chart yet.")+'</div>';
  let max=Math.max(...all),min=0;if(max===min)max=min+1;
  const nice=niceTicks(min,max,4);min=nice[0];max=nice[nice.length-1];
  const ys=v=>P.t+(1-(v-min)/(max-min))*(H-P.t-P.b);
  const f=o.fmt||num;
  let g="";nice.forEach(t=>{g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-8}" y="${ys(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${f(t)}</text>`});
  const step=Math.max(1,Math.ceil(ks.length/8));
  const xl=i=>o.xl?o.xl[i]:fmtM(ks[i]).replace(/ (\d\d)(\d\d)$/," $2");
  ks.forEach((k,i)=>{if(i%step===0||i===ks.length-1)g+=`<text x="${xs(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${xl(i)}</text>`});
  series.forEach(s=>{let d="",pen=false;s.values.forEach((v,i)=>{if(!ok(v)){pen=false;return}d+=(pen?"L":"M")+xs(i).toFixed(1)+" "+ys(v).toFixed(1)+" ";pen=true});
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" ${s.dash?'stroke-dasharray="'+(s.dash===true?"5 4":s.dash)+'"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>{if(ok(v)){const last=s.values.slice(i+1).every(x=>!ok(x));g+=`<circle cx="${xs(i)}" cy="${ys(v)}" r="${last?4:2.6}" fill="${s.color}"><title>${esc(s.name)} · ${o.xl?o.xl[i]:fmtM(ks[i])} : ${f(v)}</title></circle>`}})});
  const leg='<div class="legend">'+series.map(s=>`<span><i style="background:${s.dash?'repeating-linear-gradient(90deg,'+s.color+' 0 4px,transparent 4px 7px)':s.color}"></i>${esc(s.name)}</span>`).join("")+"</div>";
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||"")}">${g}</svg></div>`+leg;
}
function niceTicks(min,max,n){const span=max-min,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw)||raw;const a=Math.floor(min/st)*st,b=Math.ceil(max/st)*st,t=[];for(let v=a;v<=b+st/2;v+=st)t.push(+v.toFixed(6));return t}
function rangeKeys(endKey,len){const out=[];const ks=keys();if(!ks.length)return out;const start=ks[0];let k=endKey;for(let i=0;i<len;i++){out.unshift(k);if(k===start)break;k=keyAdd(k,-1)}return out}
const moneyAxis=v=>cur(v,0);

const V=document.getElementById("view");
const YOY=()=>T("vs N-1","vs LY");
function delta(c,old,goodUp,isPct){
  if(!ok(c)||!ok(old))return '<span class="flat">'+T("N-1 : —","LY: —")+'</span>';
  const d=isPct?(c-old)*100:(old?c/old-1:0)*100;const cls=Math.abs(d)<0.5?"flat":((d>0)===goodUp?"up":"down");
  return `<span class="${cls}">${d>0?"▲":d<0?"▼":"■"} ${fmt1(Math.abs(d))}${isPct?" pt":(S.lang==="en"?"%":" %")} ${YOY()}</span>`;
}
function kpi(lbl,val,c1,c2){return `<div class="kpi"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="cmp">${c1||""}${c2?"<span>"+c2+"</span>":""}</div></div>`}

function bestYear(){const ys=[...new Set(keys().map(k=>k.slice(0,4)))];let b=null;ys.forEach(y=>{const a=aggregate(y+"-12",12);if(a&&a.leads>0&&a.rGlobal!=null&&(!b||a.rGlobal>b.a.rGlobal))b={y,a}});return b}
function runSim(){
  const el=document.getElementById("simOut");if(!el)return;
  const g=id=>{const v=parseFloat(document.getElementById(id).value);return isFinite(v)?v:null};
  const cible=g("pCible"),ech=Math.max(1,g("pEch")||1),act=g("pActifs"),ch=(g("pChurn")||0)/100,cpl=g("pCpl"),bmin=g("pBmin"),bmax=g("pBmax"),prix=g("pPrix");
  const a=aggregate(S.sel,S.win);const best=bestYear();
  if(cible==null||act==null||cpl==null){el.innerHTML='<div class="msg warn">'+T("Remplis la cible, les membres actifs et le coût par lead.","Fill in the target, active members and cost per lead.")+'</div>';return}
  const moyBase=(act+cible)/2;const besoin=Math.max(0,(cible-act)/ech)+moyBase*ch;
  const sc=[{n:T("Entonnoir actuel","Current funnel"),c:a&&a.rGlobal},{n:T("Au niveau franchise","At franchise level"),c:a&&a.fr.overall},{n:T("Meilleure année","Best year")+(best?" ("+best.y+")":""),c:best&&best.a.rGlobal}];
  let h=`<div class="out" style="margin-bottom:12px"><div><span>${T("Ventes requises / mois","Sales needed / month")}</span><b>${fmt1(besoin)}</b></div><div><span>${T("Dont remplacement des départs","Of which replacing departures")}</span><b>${fmt1(moyBase*ch)}</b></div><div><span>${T("Revenu récurrent visé","Target recurring revenue")}</span><b>${prix?money(cible*prix):"—"}</b></div></div>`;
  h+=`<div class="tablewrap"><table><thead><tr><th>${T("Scénario","Scenario")}</th><th>Conversion</th><th>${T("Leads / mois","Leads / month")}</th><th>${T("Budget / mois","Budget / month")}</th><th>Verdict</th></tr></thead><tbody>`;
  sc.forEach(s=>{if(!s.c){h+=`<tr><td>${s.n}</td><td colspan="4" class="flat">—</td></tr>`;return}
    const leads=besoin/s.c,bud=leads*cpl;const st=bud<=bmax?(bud<=bmin?"ok":"warn"):"bad";
    h+=`<tr><td>${s.n}</td><td>${pct(s.c)}</td><td>${fmt0(Math.ceil(leads))}</td><td><b>${money(bud)}</b></td><td><span class="chip ${st}">${st==="ok"?T("Sous le min.","Below min."):st==="warn"?T("Dans l'enveloppe","Within budget"):T("Hors enveloppe","Over budget")}</span></td></tr>`});
  h+='</tbody></table></div><p class="note" style="margin-top:8px">'+T("L'écart entre la ligne « actuel » et la ligne « franchise » est le budget que la correction de l'entonnoir économise chaque mois.","The gap between the “current” and “franchise” rows is the budget that fixing the funnel saves every month.")+'</p>';
  el.innerHTML=h;
}

function barChart(vals,labels,o={}){
  const W=640,H=o.h||220,P={l:44,r:14,t:16,b:30};
  const okv=vals.filter(ok);if(!okv.length)return '<div class="empty">'+T("Pas encore de données pour ce graphique.","No data for this chart yet.")+'</div>';
  const nice=niceTicks(0,Math.max(...okv,o.ref||0)*1.05,4);const max=nice[nice.length-1];
  const ys=v=>P.t+(1-v/max)*(H-P.t-P.b);const bw=(W-P.l-P.r)/vals.length;
  let g="";nice.forEach(t=>{g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--line)"/><text x="${P.l-8}" y="${ys(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${(o.fmt||fmt1)(t)}</text>`});
  vals.forEach((v,i)=>{const x=P.l+i*bw+bw*0.18,w=bw*0.64;
    if(ok(v)){const hi=o.ref!=null&&v>=o.ref;g+=`<rect x="${x}" y="${ys(v)}" width="${w}" height="${ys(0)-ys(v)}" rx="3" fill="${hi?"var(--accent)":"var(--bench)"}" ${hi?"":'opacity="0.55"'}><title>${labels[i]} : ${(o.fmt||fmt1)(v)}</title></rect>`}
    g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${labels[i]}</text>`});
  if(o.ref!=null)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${ys(o.ref)}" y2="${ys(o.ref)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||"")}">${g}</svg></div><div class="legend"><span><i style="background:var(--accent)"></i>${T("Au-dessus de la moyenne","Above average")}</span><span><i style="background:var(--bench);opacity:.55"></i>${T("Sous la moyenne","Below average")}</span>${o.refLabel?`<span><i style="background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 7px)"></i>${o.refLabel}</span>`:""}</div>`;
}

/* ---------- parseur ---------- */
function toN(s){if(s==null)return null;const v=parseFloat(String(s).replace(/[,\s$ −]/g,m=>m==="−"?"-":""));return isFinite(v)?v:null}
function parseReports(txt){
  const re=/\b(20\d\d)-(0[1-9]|1[0-2])\b/g;const hits=[];let m;
  while((m=re.exec(txt)))hits.push({k:m[1]+"-"+m[2],i:m.index});
  const out=[];
  hits.forEach((h,j)=>{
    const b=txt.slice(h.i,j+1<hits.length?hits[j+1].i:txt.length);
    const g=r=>{const x=b.match(r);return x?toN(x[1]):null};
    if(g(/Total Leads:\s*([\d,]+)/)==null)return;
    const d={mois:h.k,fr:{}};
    d.leads=g(/Total Leads:\s*([\d,]+)/);d.booked=g(/Booked Trials:\s*([\d,]+)/);
    d.schedCame=g(/Scheduled Camein:\s*([\d,]+)/);d.schedBook=g(/Scheduled Bookings:\s*([\d,]+)/);
    d.newActive=g(/Total Active:\s*([\d,]+)/);d.came=g(/Total Camein:\s*([\d,]+)/);
    d.expiredPrev=g(/Total Expired \(Last Month\):\s*([\d,]+)/);d.activePrev=g(/Total Active \(Last Month\):\s*([\d,]+)/);
    const fa=b.match(/Average[\s\S]*?([\d.]+)\s*%\s+([\d.]+)\s*%\s+([\d.]+)\s*%\s+([\d.]+)\s*%\s+([\d.]+)\s*%/);
    if(fa){["booked","completed","sales","overall","churn"].forEach((f,i)=>d.fr[f]=toN(fa[i+1])/100)}
    const N="(-?\\s*[\\d,.]+|-|N\\/A)";
    const pl=b.match(new RegExp("\\$\\s*"+N+"\\s+"+N+"\\s+\\$\\s*"+N+"\\s+\\$\\s*"+N+"\\s*\\/\\s*"+N+"\\s*\\/\\s*"+N));
    if(pl){d.ltv=toN(pl[1]);d.impressions=toN(pl[2]);d.initRev=toN(pl[3]);d.spend=toN(pl[4]);d.prepaid=toN(pl[5]);d.credit=toN(pl[6])}
    const ln=b.match(/(\d+)\s*Year\/s\s*(\d+)\s*Month\/s\s*(\d+)\s*Day\/s\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/);
    if(ln){d.dureeMoy=ln[1]+" an "+ln[2]+" mois "+ln[3]+" j";d.checkin=toN(ln[4]);d.checkinFr=toN(ln[5]);d.checkinMax=toN(ln[6])}
    const miss=["leads","booked","schedBook","schedCame","came","newActive","expiredPrev","activePrev","spend","impressions","ltv"].filter(f=>d[f]==null);
    out.push({d,miss});
  });
  return out;
}

function downloadFile(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportCSV(){const cols=["mois","leads","booked","schedBook","schedCame","came","newActive","expiredPrev","activePrev","ltv","impressions","initRev","spend","autres","prepaid","credit","checkin","checkinFr"];
  const fc=["booked","completed","sales","overall","churn"];
  const head=cols.concat(fc.map(f=>"fr_"+f),["tx_reservation","tx_presence","tx_closing","conv_globale","annulations","cpl","cac","valeur_cout","notes"]);
  const r4=v=>ok(v)?(+v).toFixed(4):"";
  const lines=[head.join(";")].concat(keys().map(k=>{const d=S.months[k],a=aggregate(k,1);return cols.map(c=>d[c]??"").concat(fc.map(f=>d.fr&&d.fr[f]!=null?d.fr[f]:""),[r4(a.rBook),r4(a.rShow),r4(a.rClose),r4(a.rGlobal),r4(a.churn),r4(a.cpl),r4(a.cac),r4(a.ltvcac),'"'+String(d.notes||"").replace(/"/g,'""')+'"']).join(";")}));
  downloadFile("30MH-acquisition-"+new Date().toISOString().slice(0,10)+".csv","﻿"+lines.join("\n"),"text/csv;charset=utf-8")}

/* ---------- liaison ---------- */
function render(){
  applyChrome();
  const ks=keys();const sel=document.getElementById("selMonth");
  if(ks.length){const first=ks[0],last=ks[ks.length-1];
    if(!S.sel||!(S.sel>=first&&S.sel<=last))S.sel=last;
    if(S.custom){
      if(!S.from||S.from<first||S.from>last)S.from=first;
      if(!S.to||S.to<first||S.to>last)S.to=last;
      if(S.from>S.to){const x=S.from;S.from=S.to;S.to=x}
      S.sel=S.to;S.win=monthsBetween(S.from,S.to);
    }
    const all=[];let k=last;while(true){all.push(k);if(k===first)break;k=keyAdd(k,-1)}
    const opts=v=>all.map(k=>`<option value="${k}" ${k===v?"selected":""}>${fmtM(k)}${S.months[k]?"":T(" (vide)"," (empty)")}</option>`).join("");
    sel.innerHTML=opts(S.sel);
    document.getElementById("selFrom").innerHTML=opts(S.from);document.getElementById("selTo").innerHTML=opts(S.to)}
  else sel.innerHTML='<option>—</option>';
  document.getElementById("wrapMonth").hidden=S.custom;document.getElementById("wrapCustom").hidden=!S.custom;
  if(!ks.length&&S.tab!=="donnees"&&S.tab!=="methode"){
    V.innerHTML=`<section class="panel"><div class="empty">${T("Aucun mois enregistré pour l'instant. Va dans l'onglet <b>Données</b> et colle un rapport Franchise Stats pour commencer.","No months saved yet. Go to the <b>Data</b> tab and paste a Franchise Stats report to start.")}</div></section>`;return}
  V.innerHTML=({bord:renderBord,entonnoir:renderEntonnoir,budget:renderBudget,saison:renderSaison,donnees:renderDonnees,methode:renderMethode})[S.tab]();
  if(S.tab==="budget")runSim();
  if(S.tab==="donnees"){if(S.editing){const p=document.getElementById("editPanel");p.innerHTML=editHTML(S.editing,S.editingNew);p.hidden=false}if(S.parsed)showParsed()}
}
const MISSLBL=()=>({leads:"leads",booked:T("essais réservés","booked trials"),schedBook:T("essais planifiés","scheduled trials"),schedCame:T("venues planifiées","scheduled show-ups"),came:T("venues","show-ups"),newActive:T("nouveaux membres","new members"),expiredPrev:T("expirés","expired"),activePrev:T("actifs mois préc.","active prev. month"),spend:T("dépense","spend"),impressions:"impressions",ltv:T("valeur à vie","lifetime value")});
function showParsed(){
  const o=document.getElementById("parseOut");if(!o)return;const P=S.parsed;const ML=MISSLBL();
  if(!P.length){o.innerHTML='<div class="msg bad">'+T("Aucun rapport reconnu. Vérifie que le texte contient la date (ex. 2025-11) et la ligne « Total Leads: ».","No report recognized. Check that the text contains the date (e.g. 2025-11) and the “Total Leads:” line.")+'</div>';return}
  o.innerHTML=`<div class="tablewrap"><table><thead><tr><th>${T("Mois","Month")}</th><th>Leads</th><th>${T("Réserv.","Booking")}</th><th>${T("Venues","Show-ups")}</th><th>${T("Nouv.","New")}</th><th>${T("Dépense","Spend")}</th><th>Impr.</th><th>${T("Crédit","Credit")}</th><th>${T("État","Status")}</th></tr></thead><tbody>${P.map(({d,miss})=>`<tr><td><b>${fmtM(d.mois)}</b>${S.months[d.mois]?' <span class="tag">'+T("remplace","replaces")+'</span>':""}</td><td>${num(d.leads)}</td><td>${num(d.booked)}</td><td>${num(d.came)}</td><td>${num(d.newActive)}</td><td>${money(d.spend)}</td><td>${num(d.impressions)}</td><td>${d.credit==null?"—":money2(d.credit)}</td><td style="white-space:normal;text-align:left">${miss.length?'<span class="chip warn">'+T("À compléter : ","Missing: ")+miss.map(f=>ML[f]||f).join(", ")+'</span>':'<span class="chip ok">'+T("Complet","Complete")+'</span>'}</td></tr>`).join("")}</tbody></table></div>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="btnCommit">${T("Enregistrer "+P.length+" mois","Save "+P.length+" month(s)")}</button><button class="btn" id="btnDiscard">${T("Annuler","Cancel")}</button></div><div id="commitMsg" style="margin-top:8px"></div>`;
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.tab=b.dataset.t;try{localStorage.setItem("acq-tab",S.tab)}catch(_){}render()});
function monthsBetween(a,b){const [y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);return (y2-y1)*12+(m2-m1)+1}
document.getElementById("segWin").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.w==="c"){if(!S.custom){S.custom=true;S.to=S.sel;S.from=S.sel?keyAdd(S.sel,-(S.win-1)):null}}
  else{if(S.custom){S.custom=false;S.sel=S.to}S.win=+b.dataset.w}
  try{localStorage.setItem("acq-period",JSON.stringify({win:S.win,custom:S.custom,from:S.from,to:S.to}))}catch(_){}
  render()});
["selFrom","selTo"].forEach(id=>document.getElementById(id).addEventListener("change",e=>{if(id==="selFrom")S.from=e.target.value;else S.to=e.target.value;

V.addEventListener("click",async e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("chk")){
    if(t.id==="chkAll"){S.selDel=t.checked?new Set(keys()):new Set()}else{t.checked?S.selDel.add(t.dataset.k):S.selDel.delete(t.dataset.k)}
    render();return}
  if(t.id==="btnDelSel"||t.id==="btnDelAll"){
    const list=t.id==="btnDelAll"?keys():[...S.selDel];if(!list.length)return;
    if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent=T("Confirmer : supprimer "+list.length+" mois","Confirm: delete "+list.length+" month(s)");
      document.getElementById("delMsg").innerHTML='<div class="msg warn" style="margin-bottom:10px">'+T("Clique de nouveau pour confirmer la suppression de "+list.length+" mois","Click again to confirm deleting "+list.length+" month(s)")+(list.length<=6?" ("+list.map(fmtM).join(", ")+")":"")+T(". Toute autre action annule.",". Any other action cancels.")+'</div>';return}
    list.forEach(k=>delete S.months[k]);persist();S.selDel=new Set();if(S.editing&&!S.months[S.editing])S.editing=null;S.sel=null;render();
    const m=document.getElementById("delMsg");if(m)m.innerHTML='<div class="msg ok" style="margin-bottom:10px">'+T(list.length+" mois supprimé(s).",list.length+" month(s) deleted.")+'</div>';return}
  const tr=t.closest("tr.click");if(tr){S.editing=tr.dataset.k;S.editingNew=false;render();document.getElementById("editPanel").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.id==="btnParse"){S.parsed=parseReports(document.getElementById("paste").value);showParsed();return}
  if(t.id==="btnDiscard"){S.parsed=null;document.getElementById("parseOut").innerHTML="";return}
  if(t.id==="btnCommit"){t.disabled=true;
    for(const {d} of S.parsed){const old=S.months[d.mois];d.autres=old?old.autres||0:0;d.notes=old?old.notes||"":"";S.months[d.mois]=d}
    const saved=persist();const n=S.parsed.length;S.parsed=null;S.sel=keys()[keys().length-1];render();
    document.getElementById("parseOut").innerHTML=saved?`<div class="msg ok">${T(n+" mois enregistré(s).",n+" month(s) saved.")}</div>`:`<div class="msg bad">${T("Les données sont affichées mais n'ont pas pu être enregistrées dans ce navigateur. Exporte une sauvegarde pour ne pas les perdre.","Data is shown but could not be saved in this browser. Export a backup so you don't lose it.")}</div>`;return}
  if(t.id==="btnExpJson"){downloadFile("30MH-acquisition-"+T("sauvegarde","backup")+"-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify({version:1,months:S.months,params:S.params},null,1),"application/json");return}
  if(t.id==="btnExpCsv"){exportCSV();return}
  if(t.id==="btnImpJson"){document.getElementById("fileJson").click();return}
  if(t.id==="btnNewMonth"){const ks=keys();S.editing=ks.length?keyAdd(ks[ks.length-1],1):new Date().toISOString().slice(0,7);S.editingNew=true;
    const p=document.getElementById("editPanel");p.innerHTML=editHTML(S.editing,true);p.hidden=false;p.scrollIntoView({behavior:"smooth"});return}
  if(t.id==="btnCancelEdit"){S.editing=null;S.editingNew=false;render();return}
  if(t.id==="btnSaveEdit"){const mi=document.getElementById("e_mois");if(mi&&/^\d{4}-\d{2}$/.test(mi.value))S.editing=mi.value;const k=S.editing;const d=Object.assign({mois:k,fr:{}},S.months[k]||{});d.mois=k;d.fr=Object.assign({},d.fr||{});
    FIELDS().forEach(([f])=>{const v=parseFloat(document.getElementById("e_"+f).value);d[f]=isFinite(v)?v:null});
    FRF().forEach(([f])=>{const v=parseFloat(document.getElementById("ef_"+f).value);d.fr[f]=isFinite(v)?v/100:null});
    d.notes=document.getElementById("e_notes").value.trim();
    S.months[k]=d;persist();S.editing=null;S.editingNew=false;render();return}
  if(t.id==="btnDel"){if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent=T("Confirmer la suppression de ","Confirm deleting ")+fmtM(S.editing);return}
    S.selDel.delete(S.editing);delete S.months[S.editing];persist();S.editing=null;S.sel=null;render();return}
  if(t.id==="saveParams"){const g=id=>parseFloat(document.getElementById(id).value);
    Object.assign(S.params,{cible:g("pCible"),echeance:g("pEch"),prixMensuel:g("pPrix"),budgetMin:g("pBmin"),budgetMax:g("pBmax")});
    t.textContent=persist()?T("Paramètres enregistrés","Settings saved"):T("Échec de l'enregistrement","Save failed");return}
});

  r.onload=()=>{const box=document.getElementById("bkMsg");try{const j=JSON.parse(r.result);if(!j.months||typeof j.months!=="object")throw 0;

})();
})();
